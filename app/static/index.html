<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oráculo — andamiaje de desarrollo</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  .aviso { border-left: 3px solid #999; padding: .5rem 1rem; color: #555; }
  .mercado { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .precio { font-size: 1.5rem; }
  button { font: inherit; padding: .4rem .8rem; margin-right: .4rem; cursor: pointer; }
  pre { background: #f5f5f5; padding: .8rem; overflow-x: auto; font-size: .85rem; }
</style>
</head>
<body>
<h1>Oráculo</h1>
<p class="aviso">Página de andamiaje para desarrollo local. La interfaz de proyección todavía no está construida.</p>
<div id="lista">Cargando mercados…</div>

<script>
const api = (ruta, opciones) => fetch(ruta, opciones).then(r => r.json());
const usuario = "dev";

async function pintar() {
  const mercados = await api("/api/markets");
  document.getElementById("lista").innerHTML = mercados.map(m => `
    <div class="mercado">
      <strong>${m.question}</strong>
      <p class="precio">SÍ ${(m.prices.YES * 100).toFixed(1)}% · NO ${(m.prices.NO * 100).toFixed(1)}%</p>
      <button onclick="operar('${m.id}','YES')">Comprar SÍ</button>
      <button onclick="operar('${m.id}','NO')">Comprar NO</button>
      <button onclick="resolver('${m.id}')">Consultar al oráculo</button>
      <p>Estado: ${m.status}${m.outcome ? " → " + m.outcome : ""}</p>
      ${m.oracle ? `<pre>${JSON.stringify(m.oracle, null, 2)}</pre>` : ""}
    </div>`).join("");
}

async function operar(id, resultado) {
  await api(`/api/markets/${id}/trade`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user: usuario, outcome: resultado, amount: 50 })
  });
  pintar();
}

async function resolver(id) {
  await api(`/api/markets/${id}/resolve`, { method: "POST" });
  pintar();
}

pintar();
</script>
</body>
</html>
